<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конторка — мини-CRM для заявок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">К</span>
        <div>
          <div class="brand-name">Конторка</div>
          <div class="brand-sub">мини-CRM для заявок</div>
        </div>
      </div>
      <nav class="nav" aria-label="Разделы">
        <a href="#/board" data-view="board"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 18 18"><rect x="2" y="3" width="4" height="12" rx="1"/><rect x="7.5" y="3" width="4" height="8" rx="1"/><rect x="13" y="3" width="3" height="10" rx="1"/></svg></span>Доска заявок</a>
        <a href="#/stats" data-view="stats"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M3 15V9M7.5 15V4M12 15v-7M16 15H2"/></svg></span>Сводка</a>
        <a href="#/webhook" data-view="webhook"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M2 9h10M9 5l4 4-4 4"/><circle cx="15" cy="9" r="1.2"/></svg></span>Webhook<span class="nav-live" id="live-dot" title="Слушаем входящие заявки"></span></a>
      </nav>
      <div class="rail-foot">
        <div class="rail-foot-title">Мастерская «Дуб и Шпон»</div>
        <div>Демо-данные. Все имена и телефоны вымышлены.</div>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="drawer-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
